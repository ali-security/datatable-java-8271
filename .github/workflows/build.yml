name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8
          cache: maven

      - name: Build and test
        run: mvn -B install

      - name: Upload datatable-dependencies artifact
        uses: actions/upload-artifact@v4
        with:
          name: datatable-dependencies-1.1.14
          path: dependencies/target/datatable-dependencies-1.1.14.jar
          retention-days: 1
          if-no-files-found: error
